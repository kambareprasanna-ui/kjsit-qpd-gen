<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <path id="topArc1" d="M 30,76 A 46,46 0 0,1 110,76" fill="none"/>
    <path id="topArc2" d="M 38,76 A 38,38 0 0,1 102,76" fill="none"/>
    <path id="bottomArc" d="M 28,68 A 48,48 0 0,0 112,68" fill="none"/>
  </defs>

  <!-- Left: Circular Somaiya Emblem -->
  <g transform="translate(0, 0)">
    <!-- Arc Text: Knowledge Alone Liberates -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="600" fill="#991B1B" letter-spacing="0.8">
      <textPath href="#topArc1" startOffset="50%" text-anchor="middle">Knowledge Alone Liberates</textPath>
    </text>

    <!-- Arc Text: Devanagari Motto -->
    <text font-family="'Noto Sans Devanagari', 'Mangal', 'Yantramanav', sans-serif" font-size="8.5" font-weight="700" fill="#991B1B" letter-spacing="0.5">
      <textPath href="#topArc2" startOffset="50%" text-anchor="middle">ज्ञानादेव तु कैवल्यम्</textPath>
    </text>

    <!-- Arc Text: Somaiya Vidyavihar (Bottom) -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" fill="#991B1B" letter-spacing="0.8">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">Somaiya Vidyavihar</textPath>
    </text>

    <!-- Center Flame / Jyoti -->
    <path d="M 70,36 C 70,36 78,48 78,57 C 78,63 74.5,67 70,67 C 65.5,67 62,63 62,57 C 62,50 67,43 67,43 C 67,43 63,48 64,55 C 65,60 67.5,62.5 70,62.5 C 72.5,62.5 74.5,59.5 74,54 C 73.5,47.5 70,36 70,36 Z" fill="#991B1B"/>

    <!-- Center Diya (Bowl / Base) -->
    <path d="M 28,68 C 36,88 52,98 70,98 C 88,98 104,88 112,68 C 98,82 82,85 70,85 C 58,85 42,82 28,68 Z" fill="#991B1B"/>
  </g>

  <!-- Right: SOMAIYA VIDYAVIHAR UNIVERSITY Typography -->
  <g transform="translate(145, 0)">
    <!-- Main Somaiya Heading -->
    <text x="0" y="70" font-family="'Times New Roman', 'Cinzel', 'Playfair Display', Georgia, serif" font-size="54" font-weight="800" fill="#991B1B" letter-spacing="2.5">SOMAIYA</text>

    <!-- Subtitle: Vidyavihar University -->
    <text x="2" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20.5" font-weight="800" fill="#991B1B" letter-spacing="3.2">VIDYAVIHAR UNIVERSITY</text>
  </g>
</svg>
