  </text>

  <!-- Arc Text: Somaiya Vidyavihar (Bottom) -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#991B1B" letter-spacing="0.8">
