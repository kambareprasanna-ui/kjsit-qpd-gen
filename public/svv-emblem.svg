  </text>

  <!-- Center Flame / Jyoti -->
  <path d="M 70,30 C 70,30 80,44 80,55 C 80,62 75.5,67 70,67 C 64.5,67 60,62 60,55 C 60,47 66,39 66,39 C 66,39 61,45 62,53 C 63,59 66.5,62 70,62 C 73.5,62 76,58.5 75.5,52 C 75,44 70,30 70,30 Z" fill="#991B1B"/>

