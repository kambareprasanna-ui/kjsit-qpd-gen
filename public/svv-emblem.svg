  <!-- Arc Text: Knowledge Alone Liberates -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#991B1B" letter-spacing="0.8">
    <textPath href="#emblemTopArc1" startOffset="50%" text-anchor="middle">Knowledge Alone Liberates</textPath>
  </text>

  <!-- Arc Text: Devanagari Motto -->
