<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <path id="emblemTopArc1" d="M 15,76 A 55,55 0 0,1 125,76" fill="none"/>
    <path id="emblemTopArc2" d="M 25,76 A 45,45 0 0,1 115,76" fill="none"/>
    <path id="emblemBottomArc" d="M 16,68 A 54,54 0 0,0 124,68" fill="none"/>
